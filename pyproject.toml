[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-mcp"
version = "0.1.0"
description = "An MCP server that turns a folder of resumes into a searchable Markdown corpus for AI tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mekka Williams" }]
keywords = ["mcp", "resume", "cv", "rag", "claude", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "fastmcp>=2.0.0",
  "watchdog>=4.0.0",
  "markitdown[pdf,docx]>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
resume-mcp = "resume_mcp.server:main"

[project.urls]
Homepage = "https://github.com/msmekka/resume-mcp"
Issues = "https://github.com/msmekka/resume-mcp/issues"

[tool.setuptools.packages.find]
include = ["resume_mcp*"]
